services:
  - type: web
    name: maktab-info-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CONTACT_NOTIFY_ID
        sync: false
      - key: PUBLISHING_ENABLED
        value: "true"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "5"
      - key: MAX_POSTS_PER_RUN
        value: "1"
      - key: MAX_POSTS_PER_HOUR
        value: "12"
      - key: MAX_POSTS_PER_DAY
        value: "50"
      - key: MIN_POST_INTERVAL_MINUTES
        value: "5"
      - key: DATABASE_PATH
        value: ./data/maktab-info.db
      - key: DEFAULT_LANGUAGE
        value: uz
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: LOG_LEVEL
        value: info
